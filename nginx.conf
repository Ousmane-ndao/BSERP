server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # API du backend Laravel : même origine que le front (pas de CORS cross-site).
    # resolver + variable dans proxy_pass : force nginx à re-résoudre "backend" via le
    # DNS Docker à chaque requête (sinon il garde l'IP du conteneur backend résolue au
    # démarrage, qui devient invalide dès que ce conteneur est recréé — 502 jusqu'au
    # prochain restart du frontend).
    resolver 127.0.0.11 valid=10s;
    location /api/ {
        set $backend_upstream backend:80;
        proxy_pass http://$backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
        proxy_read_timeout 300s;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA : toute route inconnue retombe sur index.html (react-router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
